# ─── Cirque Trackpad Configuration ──────────────────────────────────────────
# Applied to the right-half trackpad build via cmake-args EXTRA_CONF_FILE.

# Enable SPI bus driver
CONFIG_SPI=y

# Enable Zephyr input subsystem (required for pointing device drivers)
CONFIG_INPUT=y

# Enable ZMK pointing device support
CONFIG_ZMK_POINTING=y

# Disable display (trackpad replaces Vista508 on right side)
CONFIG_ZMK_DISPLAY=n
